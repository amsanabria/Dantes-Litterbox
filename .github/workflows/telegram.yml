name: Telegram Bot

on:
  repository_dispatch:
    types: [telegram_message]

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache modelo de visión
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-moondream2-2024-08-26
          restore-keys: |
            hf-model-moondream2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          TEXT: ${{ github.event.client_payload.text }}
          FILE_ID: ${{ github.event.client_payload.file_id }}
        run: python main.py
